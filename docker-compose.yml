# SilverFile in Docker, with saved cases kept between runs.
#
#   cp .env.example .env              once (fill in an API key only to read W-2 photos)
#   docker compose up --build         then open:
#     http://localhost:8501           start page: "I'm a taxpayer" / "I'm a Kushim volunteer"
#     http://localhost:8501/telemetry telemetry (staff, not linked from the start page)
#     http://localhost:8502           W-2 photo page
#   docker compose down               stop; saved cases are kept
#   docker compose down -v            stop and delete all saved cases, uploads and traces
#
# The chat, the volunteer dashboard and telemetry are pages of one app (src/ui/silverfile_home.py), so
# they run in one container. The W-2 page is a separate app; it shares the same volumes, so both see
# the same cases. Saved cases and uploads (runtime/) and traces plus the audit log (traces/) live in
# named volumes, not in a container, so they survive restarts and new containers.
#
# Secrets: the W-2 page reads the .env file itself, not environment variables, so the file is
# mounted read-only. It is never copied into the image (.dockerignore) or committed (.gitignore).

x-silverfile: &silverfile
  build: .
  image: silverfile
  volumes:
    - runtime:/app/runtime
    - traces:/app/traces
    - type: bind
      source: ./.env
      target: /app/.env
      read_only: true
      bind:
        create_host_path: false   # a missing .env is an error ("cp .env.example .env"), not an empty folder
  restart: unless-stopped

services:
  app:
    <<: *silverfile
    command: streamlit run src/ui/silverfile_home.py --server.port 8501
    ports: ["8501:8501"]

  w2:
    <<: *silverfile
    command: streamlit run app.py --server.port 8502
    ports: ["8502:8502"]

volumes:
  runtime:
  traces:
