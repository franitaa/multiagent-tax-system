# Runs the test suite on every push and pull request, on each supported Python version.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Eval cases
        run: python -m evals.runner

  # Builds the container and checks each documented way of running it.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t silverfile .
      - name: Default command (clean demo case)
        run: docker run --rm silverfile | tee run.log && grep -q "DRAFT READY" run.log
      - name: Tests inside the container
        run: docker run --rm silverfile pytest -q
      - name: Eval cases inside the container
        run: docker run --rm silverfile python -m evals.runner
      - name: Chat page starts and answers
        run: |
          docker run -d --name chat -p 127.0.0.1:8501:8501 silverfile streamlit run src/ui/taxpayer_chat.py
          for i in $(seq 1 30); do curl -sf http://localhost:8501/_stcore/health && exit 0; sleep 1; done
          docker logs chat; exit 1

  # The documented way to run the whole app (docker-compose.yml): every page draws, the volunteer
  # dashboard sees the chat's cases, and cases and their history survive new containers.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start the app with volumes
        run: |
          cp .env.example .env
          docker compose up -d --build
      - name: The app answers
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:8501/_stcore/health && break; sleep 1; done
          curl -sf http://localhost:8501/_stcore/health || { docker compose logs; exit 1; }
      - name: Every page draws without an error
        run: |
          docker compose exec -T app python -c "
          from streamlit.testing.v1 import AppTest
          pages = ['src/ui/silverfile_home.py', 'src/ui/taxpayer_chat.py', 'src/ui/volunteer_dashboard.py',
                   'src/ui/telemetry_dashboard.py', 'app.py']
          for page in pages:
              errors = [e.value for e in AppTest.from_file(page, default_timeout=60).run().exception]
              assert not errors, f'{page}: {errors[0]}'
              print('ok', page)"
      - name: A question on the chat reaches the volunteer dashboard
        run: |
          docker compose exec -T app python -c "
          from src.ui import chat_session as chat
          graph = chat.make_graph(chat.open_saved_sessions())
          chat.start(graph, 'ci-case')
          chat.send(graph, 'ci-case', 'Should I file jointly with my husband?')
          from src.ui import dashboard_data as dash
          assert dash.pending(dash.open_graph(), 'ci-case'), 'the dashboard does not see the case waiting'"
      - name: Cases and their history survive new containers
        run: |
          docker compose down
          docker compose up -d
          sleep 5
          docker compose exec -T app python -c "
          from src.ui import dashboard_data as dash
          assert 'ci-case' in dash.case_ids(dash.open_graph()), 'saved case lost'
          assert dash.history('ci-case') and dash.history_intact('ci-case'), 'case history lost or broken'"
      - name: A W-2 photo added in the chat is checked on the volunteer dashboard
        run: |
          docker compose exec -T app python -c "
          import sys; sys.path.insert(0, 'tests_p3')
          from pathlib import Path
          from p3_helpers import FakeReader  # offline stand-in for the AI reader: no key, no call
          from src.ui import chat_session as chat, dashboard_data as dash
          from tests.test_intake_agent import FULL_ANSWERS
          service = chat.make_app_service(reader=FakeReader())
          graph, case = service.graph, chat.new_case_id()
          chat.start(graph, case)
          for answer in FULL_ANSWERS:
              chat.send(graph, case, answer)
              if chat.waiting_for_w2(graph, case):
                  assert chat.add_w2(service, case, Path('data/fixtures/w2_01.jpg').read_bytes(), confirmed=True) is None
          assert (dash.pending(graph, case) or {}).get('condition') == 'EXTRACTION_REVIEW', 'no W-2 check waiting'
          assert dash.decide_w2(service, case, True, 'Amounts match the photo.', 'ci-volunteer',
                                checked_photo=True, tax_year=2025) is None
          values = graph.get_state({'configurable': {'thread_id': case}}).values
          assert values['status'] == 'complete' and values['computed']['line_1a']['value'] > 0, 'no draft with wages'
          assert list(Path('runtime/uploads').glob('*.png')), 'the photo is not in the runtime volume'"
      - name: Stop and clean up
        if: always()
        run: docker compose down -v
