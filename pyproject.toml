[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "silverfile-document-extraction"
version = "0.4.1"
description = "SilverFile OpenAI/Claude vision extraction and persistent case memory"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=11,<13", "pydantic>=2.10,<3", "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4", "openai>=2,<3", "anthropic>=1.0,<2",
  "python-dotenv>=1,<2", "streamlit>=1.42,<2",
]

[project.optional-dependencies]
dev = ["ruff>=0.11,<1"]

[tool.setuptools]
py-modules = ["provenance", "security", "document_security", "tax_math", "computation_agent"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "silverfile_extraction*"]

[tool.ruff]
target-version = "py311"
line-length = 110
