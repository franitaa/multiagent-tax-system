# Taxpayer chat page (src/ui/taxpayer_chat.py): always use the light, high-contrast theme,
# whatever the computer's own setting is. On a Mac in dark mode Streamlit would otherwise
# draw dark buttons and boxes on the page's white background, which is hard to read
# (spotted by Shruti). Streamlit reads this file from the folder `streamlit run` starts in.
[theme]
base = "light"
primaryColor = "#1f4e9a"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#eef3fb"
textColor = "#111111"
